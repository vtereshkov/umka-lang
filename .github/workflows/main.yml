name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # MinGW has no `cc`
      - name: build
        run: make all CC=gcc

      # The test script doesn't stop on failures by itself, hence `sh -e`
      - name: test
        if: runner.os == 'Linux'
        run: |
          ./build_linux.sh
          sh -e ./test_linux.sh
